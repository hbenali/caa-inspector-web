<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page not found · CAA Checker</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to CAA Checker to inspect or generate a domain's CAA records.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0c1218">

  <link rel="preload" href="/fonts/big-shoulders-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/newsreader-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
<main class="nf wrap">
  <p class="nf-code display">404</p>
  <h1 class="display">Page not found</h1>
  <p class="nf-lead">The page you're looking for doesn't exist or has been moved.</p>

  <div class="nf-links">
    <a class="link" href="/">Go to homepage</a>
    <a class="link" href="/?domain=example.com">Check CAA records</a>
  </div>

  <div class="nf-search search-suggestion">
    <p>Try checking CAA records for a domain:</p>
    <form class="inline-search" id="jumpForm">
      <div class="field">
        <label for="domainInput">Domain name</label>
        <div class="field-row">
          <input type="text" id="domainInput" placeholder="example.com" value="hbenali.ovh" autocomplete="off">
          <button type="submit" id="searchBtn" class="btn">Check</button>
        </div>
      </div>
    </form>
  </div>
</main>

<div class="foot">
  <footer>
    <a href="/">CAA record checker</a>
    <a href="/sitemap.xml">Sitemap</a>
    <a href="https://hbenali.ovh" target="_blank" rel="noopener noreferrer">hbenali.ovh</a>
  </footer>
</div>

<script>
  (function() {
    var form = document.getElementById('jumpForm');
    var input = document.getElementById('domainInput');
    form.addEventListener('submit', function(e) {
      e.preventDefault();
      var domain = input.value.trim();
      window.location.href = domain ? '/?domain=' + encodeURIComponent(domain) : '/';
    });

    var urlParams = new URLSearchParams(window.location.search);
    var domainParam = urlParams.get('domain');
    if (domainParam) input.value = domainParam;
  })();
</script>
</body>
</html>
