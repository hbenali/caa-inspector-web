<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page not found · CAA Checker</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to CAA Checker to inspect or generate a domain's CAA records.">
  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#1e3a6b">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-1: #f0f5ff;
      --bg-2: #e9eefa;
      --text: #1a2639;
      --text-muted: #3f4e77;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(255, 255, 255, 0.5);
      --accent: #3a7bd5;
      --accent-dark: #1e3a6b;
      --accent-darker: #143157;
      --input-bg: #ffffff;
      --input-border: rgba(58, 123, 213, 0.2);
      --select-border: #b8ceff;
      --shadow-color: rgba(0, 20, 60, 0.25);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg-1: #0f172a;
        --bg-2: #1c2c40;
        --text: #e6edf5;
        --text-muted: #93aec4;
        --card-bg: rgba(20, 30, 46, 0.78);
        --card-border: rgba(255, 255, 255, 0.08);
        --accent: #3498db;
        --accent-dark: #5dade2;
        --accent-darker: #6cc0f0;
        --input-bg: #131f30;
        --input-border: rgba(52, 152, 219, 0.25);
        --select-border: #2d4257;
        --shadow-color: rgba(0, 0, 0, 0.45);
      }
    }

    :root[data-theme="dark"] {
      --bg-1: #0f172a;
      --bg-2: #1c2c40;
      --text: #e6edf5;
      --text-muted: #93aec4;
      --card-bg: rgba(20, 30, 46, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent: #3498db;
      --accent-dark: #5dade2;
      --accent-darker: #6cc0f0;
      --input-bg: #131f30;
      --input-border: rgba(52, 152, 219, 0.25);
      --select-border: #2d4257;
      --shadow-color: rgba(0, 0, 0, 0.45);
    }

    body {
      background: linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: var(--text);
      transition: background 0.3s, color 0.3s;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 2.5rem;
      box-shadow: 0 25px 50px -12px var(--shadow-color), inset 0 1px 2px rgba(255,255,255,0.1);
      width: 100%;
      max-width: 700px;
      padding: 3rem 2.5rem;
      border: 1px solid var(--card-border);
      text-align: center;
    }

    .error-code {
      font-size: clamp(4rem, 18vw, 8rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, var(--accent-dark), var(--accent));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -0.03em;
    }

    .divider {
      width: 80px;
      height: 4px;
      background: linear-gradient(90deg, var(--accent), #a1c1ff);
      border-radius: 2px;
      margin: 1.5rem auto;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: var(--accent-dark);
      margin-bottom: 1rem;
    }

    .message {
      font-size: 1.2rem;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      line-height: 1.5;
    }

    .domain-preview {
      background: rgba(58, 123, 213, 0.1);
      border-radius: 60px;
      padding: 0.8rem 1.8rem;
      display: inline-block;
      margin-bottom: 2rem;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 1.1rem;
      color: var(--accent-dark);
      border: 1px solid var(--card-border);
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .primary-btn {
      background: var(--accent-dark);
      border: none;
      padding: 1rem 2.3rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.05rem;
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 12px 22px -10px var(--shadow-color);
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.3);
      text-decoration: none;
    }

    .primary-btn:hover {
      background: var(--accent-darker);
      transform: scale(1.02);
      box-shadow: 0 18px 28px -10px var(--shadow-color);
    }

    .secondary-btn {
      background: var(--input-bg);
      color: var(--accent-dark);
      border: 2px solid var(--select-border);
      padding: 1rem 2.3rem;
      border-radius: 60px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      text-decoration: none;
      box-shadow: 0 6px 12px -8px var(--shadow-color);
    }

    .secondary-btn:hover {
      background: rgba(58, 123, 213, 0.08);
      border-color: var(--accent);
      transform: scale(1.01);
    }

    .search-suggestion {
      margin-top: 2.5rem;
      padding-top: 1.5rem;
      border-top: 1px dashed var(--select-border);
    }

    .search-suggestion p {
      color: var(--text-muted);
      margin-bottom: 1rem;
      font-size: 0.95rem;
    }

    .inline-search {
      display: flex;
      max-width: 450px;
      margin: 0 auto;
      background: var(--input-bg);
      border-radius: 60px;
      border: 2px solid var(--input-border);
      overflow: hidden;
    }

    .inline-search input {
      flex: 1;
      padding: 1rem 1.5rem;
      border: none;
      outline: none;
      font-size: 1rem;
      background: transparent;
      color: var(--text);
      min-width: 0;
    }

    .inline-search button {
      background: var(--accent-dark);
      border: none;
      padding: 0 2rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .inline-search button:hover {
      background: var(--accent-darker);
    }

    footer {
      margin-top: 2.5rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--text-muted);
      text-decoration: underline;
    }

    footer a:hover {
      color: var(--accent-dark);
    }

    .globe-icon {
      font-size: 1.5rem;
      margin-right: 0.3rem;
      vertical-align: middle;
    }

    @media (max-width: 480px) {
      .glass-card { padding: 2.2rem 1.5rem; border-radius: 1.6rem; }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="error-code">404</div>
    <div class="divider"></div>

    <h1>Page not found</h1>

    <div class="message">
      The page you're looking for doesn't exist or has been moved.
    </div>

    <div class="domain-preview">
      <span class="globe-icon">🌐</span> caa.hbenali.ovh
    </div>

    <div class="action-buttons">
      <a href="/" class="primary-btn">
        <span>🏠</span> Go to homepage
      </a>
      <a href="/?domain=example.com" class="secondary-btn">
        <span>🔍</span> Check CAA records
      </a>
    </div>

    <div class="search-suggestion">
      <p>Try checking CAA records for a domain:</p>
      <form class="inline-search" id="jumpForm">
        <input type="text" id="domainInput" placeholder="example.com" value="hbenali.ovh" aria-label="Domain name" autocomplete="off">
        <button type="submit" id="searchBtn">Check</button>
      </form>
    </div>

    <footer>
      <a href="/">CAA record checker</a> ·
      <a href="/sitemap.xml">Sitemap</a> ·
      <a href="https://hbenali.ovh" target="_blank" rel="noopener noreferrer">hbenali.ovh</a>
    </footer>
  </div>

  <script>
    (function() {
      try {
        var theme = localStorage.getItem('caaCheckerTheme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}

      var form = document.getElementById('jumpForm');
      var input = document.getElementById('domainInput');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var domain = input.value.trim();
        window.location.href = domain ? '/?domain=' + encodeURIComponent(domain) : '/';
      });

      var urlParams = new URLSearchParams(window.location.search);
      var domainParam = urlParams.get('domain');
      if (domainParam) input.value = domainParam;
    })();
  </script>
</body>
</html>
